# =====================================================================
# EJEMPLO de configuración (no lo usa la aplicación: es una guía).
#
# La aplicación lee la conexión desde variables de entorno:
#   DB_PASSWORD  contraseña de PostgreSQL            (obligatoria)
#   DB_USER      usuario de PostgreSQL               (por defecto: postgres)
#   DB_URL       URL JDBC de la base alquiler_trajes  (por defecto: localhost:5432)
#
# Formas de darle valor:
#   · IntelliJ: Run → Edit Configurations → Environment variables → DB_PASSWORD=tu_password_aqui
#   · Windows (una vez, para la terminal):   setx DB_PASSWORD "tu_password_aqui"
#   · Linux / macOS:                         export DB_PASSWORD=tu_password_aqui
#
# Equivale a tener esto en application.properties (¡no lo subas con tu contraseña real!):
# =====================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/alquiler_trajes
spring.datasource.username=postgres
spring.datasource.password=tu_password_aqui
