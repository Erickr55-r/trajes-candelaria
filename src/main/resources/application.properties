spring.application.name=alquiler-trajes

# ---- Conexión a PostgreSQL ----
# Las credenciales NO se escriben aquí: se leen de variables de entorno.
#   DB_PASSWORD (obligatoria) · DB_USER (por defecto postgres) · DB_URL (por defecto localhost:5432/alquiler_trajes)
# En IntelliJ ya está la Run Configuration "Trajes Candelaria" con DB_PASSWORD.
# Ver application-example.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alquiler_trajes}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ---- Aplicación de escritorio (JavaFX) ----
# Spring solo se usa para la conexión y las transacciones: sin servidor web.
spring.main.web-application-type=none
spring.main.banner-mode=off

# No crear tablas automáticamente: la base se carga con db/base_datos.sql
spring.sql.init.mode=never
